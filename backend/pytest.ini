[pytest]
asyncio_mode = auto
# Both loop-scope options below require pytest-asyncio >= 0.26, which in turn
# requires pytest >= 8.2 (see requirements.txt). On 0.23.x they were accepted
# and silently ignored -- pytest only warns about unknown ini keys -- so every
# async test quietly ran on its own event loop. tests/conftest.py asserts the
# installed version so a downgrade fails loudly instead of degrading.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
